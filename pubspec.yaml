name: bangla_pdf_fixer
description: Unicode-first Bangla/Bengali PDF text shaping for Flutter, powered by pdf_text_shaper and HarfBuzz.
version: 3.1.1
homepage: https://github.com/ardevcraft/bangla_pdf_fixer
repository: https://github.com/ardevcraft/bangla_pdf_fixer
issue_tracker: https://github.com/ardevcraft/bangla_pdf_fixer/issues
documentation: https://github.com/ardevcraft/bangla_pdf_fixer#readme
environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

platforms:
  android:
  ios:
  linux:
  macos:
  windows:

dependencies:
  pdf_text_shaper: ^1.1.0
  flutter:
    sdk: flutter
  pdf: ^3.13.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

topics:
  - bangla
  - bengali
  - pdf
  - unicode
  - typography

screenshots:
  - description: 'PDF Fixer Icon'
    path: 'images/icon.png'
